name: CI

# Freqtrade is intentionally not installed in this workflow.
#
# The reasoning: freqtrade is supplied to this project as an explicit source
# checkout via FREQTRADE_SRC, not as a floating PyPI dependency, and installing
# it in CI would test a *different* framework revision than the one behind any
# recorded result. The pure research logic (indicators, signals, risk) has no
# freqtrade dependency at all, so it is fully covered here. Tests that need
# freqtrade skip themselves via pytest.importorskip and are run locally against
# the pinned checkout.

on:
  push:
    branches: ["main", "research/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pytest pytest-cov ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: python -m pytest tests -q
